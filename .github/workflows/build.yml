name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Crear proyecto base
        run: flutter create --platforms=android --project-name egba app

      - name: Copiar tu código
        run: |
          cp pubspec.yaml app/pubspec.yaml
          rm -rf app/lib
          cp -r lib app/lib

      - name: Poner nombre eGBA a la app
        run: sed -i 's/android:label="[^"]*"/android:label="eGBA"/' app/android/app/src/main/AndroidManifest.xml

      - name: Compilar
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: egba-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
