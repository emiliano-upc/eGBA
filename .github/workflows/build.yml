name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Genera la parte de Android (no hace falta subirla)
      - name: Crear proyecto base
        run: flutter create --platforms=android --project-name gba_app app

      # Usa tus archivos en lugar de los de ejemplo
      - name: Copiar tu código
        run: |
          cp pubspec.yaml app/pubspec.yaml
          rm -rf app/lib
          cp -r lib app/lib

      - name: Compilar
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: gba-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
